[tool.pytest]
# pytest --log-cli-level=INFO
# log_cli = true
# log_cli_level = "INFO"
minversion = "9.0"
addopts = [
	"-v",
	"-ra",
	"--import-mode=importlib",
]
# "--cache-clear",
# "--strict-markers"
# "-p", "no:qgis",  # Disable pytest-qgis plugin - conflicts with our custom fixtures
# "--tb=short", "
testpaths = [
    "test",
]
# there's no package
# pythonpath = [
#   "src"
# ]

# https://black.readthedocs.io/en/stable/usage_and_configuration/the_basics.html
[tool.black]
enabled = true
line-length = 120
preview = true

[tool.isort]
line_length = 120

[tool.pylint.BASIC]
good-names = [
    "i",
    "j",
    "k",
    "e",
    "H",
    "W",
    "df",
    "dt",
    "dx",
    "dy",
    "ok",
    "_",
]

[tool.pylint.FORMAT]
max-line-length = 120

[tool.pylsp-mypy]
enabled = true

[[tool.mypy.overrides]]
module = [
    "fire2a",
    "fire2a.*",
    "processing",
]
follow_untyped_imports = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Disable fix for unused imports (`F401`).
unfixable = ["F401"]
